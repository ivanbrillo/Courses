  <line x1="50" y1="50" x2="50" y2="70" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="70" y2="65" stroke="white" stroke-width="1.5" opacity="0.6"/>
